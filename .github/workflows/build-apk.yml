name: Build & Release Debug APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Prepare Environment & Keystore
        run: |
          cp -n .env.example .env || true
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirMesh-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: always() && hashFiles('app/build/outputs/apk/debug/app-debug.apk') != ''
        with:
          tag_name: ${{ github.ref_name == 'main' || github.ref_name == 'master' && format('v1.0.{0}', github.run_number) || github.ref_name }}
          name: AirMesh Offline P2P v1.0.${{ github.run_number }}
          body: |
            ### 🚀 AirMesh Offline P2P Android APK
            
            **Direct Download:** Download `app-debug.apk` below and install it directly on your Android phone.
            - **Architecture:** Offline Bluetooth Mesh & Wi-Fi Direct
            - **Security:** End-to-End Encrypted (AES-256-GCM)
            - **Build Run:** #${{ github.run_number }}
            - **Commit:** ${{ github.sha }}
          files: app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
